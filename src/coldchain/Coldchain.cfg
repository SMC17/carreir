\* TLC configuration for Coldchain.tla
\*
\* Bounded model-check parameters chosen to keep state-space tractable
\* while still exercising every adversary action class:
\*   - Insert with forged hmac
\*   - Delete arbitrary entry
\*   - Swap two adjacent entries
\*   - Tamper with payload, prior_hmac, or hmac
\*
\* Adversary action set: any combination of the above on any prefix of
\* the writer's log up to MaxEntries.

SPECIFICATION Spec

CONSTANTS
    Payloads = { p1, p2 }
    MaxEntries = 3
    Key = "WriterKey"
    Genesis = "Zero"

INVARIANTS
    WriterLogIsAlwaysValid
    TamperDetection
    ReorderingDetected

\* Stop on first invariant violation; TLC default but stated explicitly.
CHECK_DEADLOCK FALSE
